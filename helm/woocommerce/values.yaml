# Default values for woocommerce chart.

global:
  environment: default

# Secrets Configuration
secrets:
  existingSecret: ""
  mysqlRootPassword: "root_secure_password_123"
  mysqlDatabase: "wordpress"
  mysqlUser: "wordpress"
  mysqlPassword: "wp_secure_password_123"
  wordpressAdminUser: "admin"
  wordpressAdminPassword: "admin_secure_password_123"
  wordpressAdminEmail: "admin@example.com"
  woocommerceConsumerKey: "ck_test_1234567890abcdef"
  woocommerceConsumerSecret: "cs_test_1234567890abcdef"

# WordPress / WooCommerce Application Configuration
wordpress:
  replicaCount: 1
  image:
    repository: wordpress
    tag: "6.5-apache"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  
  # Custom environment variables for WordPress
  env:
    WORDPRESS_TABLE_PREFIX: "wp_"
    WORDPRESS_CONFIG_EXTRA: |
      /* Increase memory limit for WooCommerce */
      define('WP_MEMORY_LIMIT', '512M');
      define('WP_MAX_MEMORY_LIMIT', '512M');
      /* Enable REST API permalinks */
      define('AUTOMATIC_UPDATER_DISABLED', true);

  # Persistence for WordPress uploads, plugins, themes
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    mountPath: /var/www/html/wp-content

  # Resource Requests & Limits
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

  # Readiness & Liveness Probes
  livenessProbe:
    httpGet:
      path: /wp-login.php
      port: 80
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5
    successThreshold: 1

  readinessProbe:
    httpGet:
      path: /wp-login.php
      port: 80
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  # Security Context
  securityContext:
    runAsUser: 33 # www-data
    runAsGroup: 33
    fsGroup: 33

# MySQL Database Configuration
mysql:
  enabled: true
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3306

  # Persistence for MySQL data
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 20Gi
    mountPath: /var/lib/mysql

  # Resource Requests & Limits
  resources:
    limits:
      cpu: 1000m
      memory: 1.5Gi
    requests:
      cpu: 250m
      memory: 512Mi

  # Readiness & Liveness Probes
  livenessProbe:
    tcpSocket:
      port: 3306
    initialDelaySeconds: 45
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    tcpSocket:
      port: 3306
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Ingress Configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
  hosts:
    - host: store.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
