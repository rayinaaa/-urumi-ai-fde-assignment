apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "woocommerce.fullname" . }}-wordpress
  labels:
    app.kubernetes.io/component: wordpress
    {{- include "woocommerce.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.wordpress.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: wordpress
  template:
    metadata:
      labels:
        app.kubernetes.io/component: wordpress
    spec:
      initContainers:
        - name: init-woocommerce
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "[Init] Preparing wp-content directories..."
              mkdir -p /var/www/html/wp-content/plugins
              mkdir -p /var/www/html/wp-content/uploads
              mkdir -p /var/www/html/wp-content/themes
              echo "[Init] Preparation completed."
          volumeMounts:
            - name: wp-storage
              mountPath: /var/www/html/wp-content
      containers:
        - name: wordpress
          image: "{{ .Values.wordpress.image.repository }}:{{ .Values.wordpress.image.tag }}"
          imagePullPolicy: {{ .Values.wordpress.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.wordpress.service.port }}
              name: http
          env:
            - name: WORDPRESS_DB_HOST
              value: "{{ include "woocommerce.fullname" . }}-mysql:3306"
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "woocommerce.secretName" . }}
                  key: mysql-database
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "woocommerce.secretName" . }}
                  key: mysql-user
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "woocommerce.secretName" . }}
                  key: mysql-password
            - name: WORDPRESS_TABLE_PREFIX
              value: {{ .Values.wordpress.env.WORDPRESS_TABLE_PREFIX | quote }}
            - name: WORDPRESS_CONFIG_EXTRA
              value: {{ .Values.wordpress.env.WORDPRESS_CONFIG_EXTRA | quote }}
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.wordpress.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.wordpress.readinessProbe | nindent 12 }}
          volumeMounts:
            - name: wp-storage
              mountPath: {{ .Values.wordpress.persistence.mountPath }}
            - name: php-config
              mountPath: /usr/local/etc/php/conf.d/uploads.ini
              subPath: uploads.ini
      volumes:
        - name: wp-storage
          {{- if .Values.wordpress.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "woocommerce.fullname" . }}-wp-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: php-config
          configMap:
            name: {{ include "woocommerce.fullname" . }}-config
            items:
              - key: uploads.ini
                path: uploads.ini
