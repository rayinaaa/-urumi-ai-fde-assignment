apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "woocommerce.fullname" . }}-config
  labels:
    {{- include "woocommerce.labels" . | nindent 4 }}
data:
  uploads.ini: |
    file_uploads = On
    memory_limit = 512M
    upload_max_filesize = 64M
    post_max_size = 64M
    max_execution_time = 300
    max_input_time = 300
  init-woocommerce.sh: |
    #!/bin/bash
    set -e
    echo "[Init] Checking WordPress and WooCommerce plugins..."
    if [ ! -d "/var/www/html/wp-content/plugins/woocommerce" ]; then
      echo "[Init] Downloading and installing WooCommerce plugin..."
      mkdir -p /var/www/html/wp-content/plugins
      curl -sL https://downloads.wordpress.org/plugin/woocommerce.latest-stable.zip -o /tmp/woocommerce.zip
      unzip -q /tmp/woocommerce.zip -d /var/www/html/wp-content/plugins/
      rm /tmp/woocommerce.zip
      chown -R www-data:www-data /var/www/html/wp-content/plugins/woocommerce
      echo "[Init] WooCommerce installed successfully."
    else
      echo "[Init] WooCommerce plugin already present."
    fi
