apiVersion: v1
kind: Service
metadata:
  name: {{ include "woocommerce.fullname" . }}-wordpress
  labels:
    app.kubernetes.io/component: wordpress
    {{- include "woocommerce.labels" . | nindent 4 }}
spec:
  type: {{ .Values.wordpress.service.type }}
  ports:
    - port: {{ .Values.wordpress.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: wordpress
