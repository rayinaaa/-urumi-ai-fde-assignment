apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "urumi-platform.fullname" . }}-mcp-isolation
  labels:
    app.kubernetes.io/component: mcp-woocommerce
    {{- include "urumi-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mcp-woocommerce
  policyTypes:
    - Ingress
  ingress:
    # Restrict ingress traffic on MCP port exclusively to Gateway pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: {{ .Values.mcpWooCommerce.service.port }}
