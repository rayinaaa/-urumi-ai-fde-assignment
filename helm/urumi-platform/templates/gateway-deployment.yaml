apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "urumi-platform.fullname" . }}-gateway
  labels:
    app.kubernetes.io/component: gateway
    {{- include "urumi-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.gateway.service.port }}
              name: http
          env:
            - name: MCP_WOOCOMMERCE_URL
              value: {{ .Values.gateway.env.MCP_WOOCOMMERCE_URL | quote }}
            - name: REDIS_URL
              value: {{ .Values.gateway.env.REDIS_URL | quote }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "urumi-platform.fullname" . }}-gateway
  labels:
    app.kubernetes.io/component: gateway
    {{- include "urumi-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: gateway
