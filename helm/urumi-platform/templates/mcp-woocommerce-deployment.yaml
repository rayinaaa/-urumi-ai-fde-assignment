apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "urumi-platform.fullname" . }}-mcp-woocommerce
  labels:
    app.kubernetes.io/component: mcp-woocommerce
    {{- include "urumi-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mcpWooCommerce.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp-woocommerce
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mcp-woocommerce
    spec:
      containers:
        - name: mcp-woocommerce
          image: "{{ .Values.mcpWooCommerce.image.repository }}:{{ .Values.mcpWooCommerce.image.tag }}"
          imagePullPolicy: {{ .Values.mcpWooCommerce.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.mcpWooCommerce.service.port }}
              name: mcp-sse
          env:
            - name: WOOCOMMERCE_STORE_URL
              value: {{ .Values.mcpWooCommerce.config.storeUrl | quote }}
          resources:
            {{- toYaml .Values.mcpWooCommerce.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "urumi-platform.fullname" . }}-mcp-woocommerce
  labels:
    app.kubernetes.io/component: mcp-woocommerce
    {{- include "urumi-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mcpWooCommerce.service.type }}
  ports:
    - port: {{ .Values.mcpWooCommerce.service.port }}
      targetPort: mcp-sse
      protocol: TCP
      name: mcp-sse
  selector:
    app.kubernetes.io/component: mcp-woocommerce
